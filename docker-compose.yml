services:
  studylens:
    build: .
    image: studylens:latest
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      SEEKDB_DIR: "/app/qoder/data/seekdb"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:3000/api/health', timeout=4).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
